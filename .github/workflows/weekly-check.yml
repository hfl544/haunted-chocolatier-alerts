 
name: Haunted Chocolatier Blog Checker

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Europe/Copenhagen"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4



      - name: TEST Telegram-besked
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🍫 Test: Din Haunted Chocolatier-bot kan sende Telegram-beskeder!"



      - name: Kør Python-bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python haunted_chocolatier.py

      - name: Gem seneste indlæg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_post.json
          if ! git diff --cached --quiet; then
            git commit -m "Update last checked blog post"
            git push
          fi
